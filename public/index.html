<script type="text/babel" data-presets="react">
const {useState, useEffect, useRef, useCallback} = React;

/* =========================================================
   AUDIO
   ========================================================= */
const Snd = (() => {
  let ctx=null, master=null;
  const get = () => {
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value=0.55;
      master.connect(ctx.destination);
    }
    if(ctx.state==='suspended') ctx.resume();
    return ctx;
  };
  const unlock = () => get();
  const tone=(f,type,dur,peak=.3,atk=.005)=>{
    const c=get(),t=c.currentTime;
    const o=c.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t);
    const g=c.createGain();
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(peak,t+atk);
    g.gain.exponentialRampToValueAtTime(.0001,t+atk+dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+atk+dur+.05);
  };
  const noiseBuf=(d)=>{
    const c=get(); const len=Math.max(1,Math.floor(c.sampleRate*d));
    const b=c.createBuffer(1,len,c.sampleRate); const a=b.getChannelData(0);
    for(let i=0;i<len;i++) a[i]=Math.random()*2-1; return b;
  };
  const noise=(dur,peak=.3,f=1200,type='bandpass')=>{
    const c=get(),t=c.currentTime;
    const s=c.createBufferSource(); s.buffer=noiseBuf(dur);
    const fl=c.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=1.2;
    s.connect(fl);
    const g=c.createGain();
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(peak,t+.005);
    g.gain.exponentialRampToValueAtTime(.0001,t+.005+dur);
    fl.connect(g); g.connect(master);
    s.start(t); s.stop(t+dur+.05);
  };
  return {
    unlock,
    tick:()=>tone(1400,'square',.02,.08,.001),
    tickFast:()=>{tone(2200,'square',.025,.14,.001);tone(1100,'sawtooth',.03,.05,.001);},
    click:()=>{tone(880,'square',.04,.12,.001);tone(1320,'square',.03,.08,.001);},
    select:()=>{tone(660,'square',.05,.12,.001);tone(990,'square',.05,.09,.0015);},
    correct:()=>{
      const c=get(),t=c.currentTime;
      noise(.08,.5,4200,'highpass');
      tone(3200,'square',.04,.25,.001);
      tone(1800,'sawtooth',.06,.15,.001);
      [523.25,659.25,783.99,1046.5].forEach((n,i)=>{
        const o=c.createOscillator(); o.type='square';
        o.frequency.setValueAtTime(n,t+i*.05);
        const g=c.createGain();
        g.gain.setValueAtTime(.0001,t+i*.05);
        g.gain.exponentialRampToValueAtTime(.18,t+i*.05+.01);
        g.gain.exponentialRampToValueAtTime(.0001,t+i*.05+.35);
        o.connect(g); g.connect(master);
        o.start(t+i*.05); o.stop(t+i*.05+.45);
      });
    },
    wrong:()=>{
      const c=get(),t=c.currentTime;
      const o=c.createOscillator(); o.type='sawtooth';
      o.frequency.setValueAtTime(120,t);
      o.frequency.exponentialRampToValueAtTime(60,t+.5);
      const g=c.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.35,t+.01);
      g.gain.exponentialRampToValueAtTime(.0001,t+.55);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t+.6);
      noise(.15,.4,400,'lowpass');
      tone(80,'square',.25,.3,.002);
    },
    hum:()=>{
      const c=get(),t=c.currentTime;
      const o=c.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(55,t);
      const o2=c.createOscillator(); o2.type='sine'; o2.frequency.setValueAtTime(82.5,t);
      const g=c.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.12,t+.3);
      o.connect(g); o2.connect(g); g.connect(master);
      o.start(t); o2.start(t);
      const stop=t+5.2;
      o.stop(stop); o2.stop(stop);
      g.gain.setValueAtTime(.12,stop-.4);
      g.gain.exponentialRampToValueAtTime(.0001,stop);
    },
    beep:()=>tone(880,'square',.06,.15,.002),
    victoryJingle:()=>{
      const c=get(),t=c.currentTime;
      [523.25,659.25,783.99,1046.5,1318.5,1567.98,2093].forEach((n,i)=>{
        const o=c.createOscillator(); o.type='square';
        o.frequency.setValueAtTime(n,t+i*.12);
        const g=c.createGain();
        g.gain.setValueAtTime(.0001,t+i*.12);
        g.gain.exponentialRampToValueAtTime(.2,t+i*.12+.01);
        g.gain.exponentialRampToValueAtTime(.0001,t+i*.12+.3);
        o.connect(g); g.connect(master);
        o.start(t+i*.12); o.stop(t+i*.12+.4);
      });
      [523.25,659.25,783.99,1046.5].forEach(n=>{
        const o=c.createOscillator(); o.type='square';
        o.frequency.setValueAtTime(n,t+1.0);
        const g=c.createGain();
        g.gain.setValueAtTime(.0001,t+1.0);
        g.gain.exponentialRampToValueAtTime(.18,t+1.02);
        g.gain.exponentialRampToValueAtTime(.0001,t+1.9);
        o.connect(g); g.connect(master);
        o.start(t+1.0); o.stop(t+2.0);
      });
    },
    fireBreath:()=>{
      const c=get(),t=c.currentTime;
      const s=c.createBufferSource();
      s.buffer=noiseBuf(1.1);
      const fl=c.createBiquadFilter(); fl.type='lowpass';
      fl.frequency.setValueAtTime(200,t);
      fl.frequency.exponentialRampToValueAtTime(3000,t+.9);
      s.connect(fl);
      const g=c.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.35,t+.1);
      g.gain.exponentialRampToValueAtTime(.0001,t+1.05);
      fl.connect(g); g.connect(master);
      s.start(t); s.stop(t+1.1);
    },
    dragonRoar:()=>{
      const c=get(),t=c.currentTime;
      const o=c.createOscillator(); o.type='sawtooth';
      o.frequency.setValueAtTime(180,t);
      o.frequency.exponentialRampToValueAtTime(90,t+.4);
      const g=c.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.28,t+.05);
      g.gain.exponentialRampToValueAtTime(.0001,t+.55);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t+.6);
    },
    explode:()=>{
      const c=get(),t=c.currentTime;
      const o=c.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(120,t);
      o.frequency.exponentialRampToValueAtTime(28,t+1.6);
      const g=c.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.6,t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+1.8);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+1.9);
      noise(1.4,.55,700,'lowpass');
      noise(.6,.35,2200,'bandpass');
    },
  };
})();

/* =========================================================
   HELPERS
   ========================================================= */
const GAME_DURATION = 60;
const FREEZE_DURATION = 5;
const fmt = (s) => Math.max(0, s).toFixed(2);

const KEYWORDS = new Set(['int','char','void','return','if','else','for','while','do','switch','case','break','continue','const','static','unsigned','signed','long','short','float','double','struct','typedef','sizeof']);

function highlightLine(line){
  const out=[]; const re=/(\/\/.*$)|(\b\d+\b)|(\b[A-Za-z_]\w*\b)|(\s+)|(.)/g;
  let m,last=0;
  while((m=re.exec(line))){
    if(m.index>last) out.push({t:line.slice(last,m.index),c:''});
    if(m[1]) out.push({t:m[1],c:'text-slate-500 italic'});
    else if(m[2]) out.push({t:m[2],c:'text-bomb-warn'});
    else if(m[3]){
      if(KEYWORDS.has(m[3])) out.push({t:m[3],c:'text-bomb-magenta font-bold'});
      else out.push({t:m[3],c:'text-slate-200'});
    }
    else if(m[4]) out.push({t:m[4],c:''});
    else if(m[5]){
      const ch=m[5];
      if('{}()[]'.includes(ch)) out.push({t:ch,c:'text-bomb-cyan'});
      else if(';,')  out.push({t:ch,c:'text-slate-500'});
      else if('+-*/%<>=!&|^~?:'.includes(ch)) out.push({t:ch,c:'text-bomb-magenta'});
      else out.push({t:ch,c:'text-slate-300'});
    }
    last=re.lastIndex;
  }
  if(last<line.length) out.push({t:line.slice(last),c:''});
  return out;
}

const DRAGON_MAP = [
  "......................",
  "...ww.................",
  "..wwww................",
  ".wwwwww...............",
  "wwwwwwww.....OOOOO....",
  "wwwwwwww....OOWWBBO...",
  "wwwwwwww....OOWWBBO...",
  ".wwwwwww....OOOOOOO...",
  "..wwwwww....OOYYYYO...",
  "...wwwwww..OOOYYYYO...",
  "....wwwww..OOOYYYYO...",
  ".....wwww..OOOYYYYO...",
  "......www..DOOOOOOOD..",
  ".......ww..DDOOOOODD..",
  "............ff.DD.D.ff",
  "...........ffff...ffff",
];
const DRAGON_COLORS = {w:'#ff9955',O:'#ff6b1a',W:'#ffffff',B:'#000000',Y:'#ffd166',D:'#a83800',f:'#ff3300'};

function DragonSprite({pixelSize=7, tint='none'}){
  const h = DRAGON_MAP.length, w = DRAGON_MAP[0].length;
  const filter = tint==='green' ? 'hue-rotate(-90deg) saturate(1.4)'
               : tint==='red'   ? 'hue-rotate(180deg) saturate(1.6)' : 'none';
  return (
    <svg width={w*pixelSize} height={h*pixelSize} viewBox={`0 0 ${w} ${h}`}
         shapeRendering="crispEdges"
         style={{filter:`drop-shadow(0 0 12px rgba(255,102,26,0.6)) ${filter}`,transition:'filter .3s'}}>
      {DRAGON_MAP.map((row,y)=>row.split('').map((ch,x)=>{
        if(ch==='.') return null;
        return <rect key={`${x}-${y}`} x={x} y={y} width={1} height={1} fill={DRAGON_COLORS[ch]||'#fff'}/>;
      }))}
    </svg>
  );
}

/* =========================================================
   QUESTION PANEL
   ========================================================= */
function QuestionPanel({question,stage,isFrozen,myWires,onSubmit,shakeKey}){
  const [value,setValue]=useState('');
  const [error,setError]=useState(null);
  const [flash,setFlash]=useState(null);
  const inputRef = useRef(null);

  useEffect(()=>{
    setValue(''); setError(null);
    if(!isFrozen && question){
      const t=setTimeout(()=>inputRef.current && inputRef.current.focus(),150);
      return ()=>clearTimeout(t);
    }
  },[question && question.id, isFrozen]);

  useEffect(()=>{
    if(shakeKey>0){ setFlash('wrong'); const t=setTimeout(()=>setFlash(null),600); return ()=>clearTimeout(t); }
  },[shakeKey]);

  const submit = () => {
    if(isFrozen||!question) return;
    const trimmed = value.trim();
    if(trimmed===''||!/^-?\d+$/.test(trimmed)){
      setError('INTEGER ONLY'); setFlash('wrong');
      Snd.wrong();
      setTimeout(()=>setFlash(null),500);
      return;
    }
    const num = parseInt(trimmed,10);
    const ok = onSubmit(num);
    if(ok===null) return;
    if(ok){ Snd.correct(); setFlash('correct'); setValue(''); setError(null); setTimeout(()=>setFlash(null),500); }
    else { Snd.wrong(); setError(null); }
  };

  const onKey = (e) => { if(e.key==='Enter'){ e.preventDefault(); submit(); } };
  const label = question ? question.label : 'STANDBY';
  const labelCls = stage==='penalty' ? 'text-bomb-magenta' : 'text-bomb-cyan';

  return (
    <div className="relative flex h-full w-full flex-col" style={{background:'linear-gradient(180deg,#12001f,#0a0014)'}}>
      <div className="flex items-center justify-between border-b-2 border-bomb-line px-5 py-3">
        <div className="flex items-center gap-3">
          <div className="relative h-2 w-2">
            <span className={`absolute inset-0 rounded-full ping ${stage==='penalty'?'bg-bomb-magenta':'bg-bomb-cyan'}`}/>
            <span className={`absolute inset-0 rounded-full ${stage==='penalty'?'bg-bomb-magenta':'bg-bomb-cyan'}`}/>
          </div>
          <div className={`font-pixel text-[10px] sm:text-xs tracking-widest ${labelCls}`}
               style={{textShadow:'0 0 6px currentColor'}}>{label}</div>
        </div>
        <div className="flex items-center gap-1.5">
          {[0,1,2].map(i=>
            <div key={i} className={`h-1.5 w-6 rounded-full transition-colors duration-500 ${myWires[i]?'bg-bomb-safe':'bg-bomb-line'}`}/>
          )}
        </div>
      </div>

      <div className="relative flex-1 overflow-auto p-4 sm:p-6">
        <div className="relative"><CodeBlock code={question ? question.code : '// awaiting orders...'}/></div>
        {flash==='correct' && <div className="pointer-events-none absolute inset-0 flash-correct"/>}
      </div>

      <div className="border-t-2 border-bomb-line p-4 sm:p-5">
        <div className="mb-2 flex items-center justify-between">
          <label className="font-pixel text-[8px] tracking-widest text-slate-500">INTEGER ANSWER</label>
          {error && <span className="font-pixel text-[8px] tracking-widest text-bomb-danger">{error}</span>}
        </div>
        <div className={flash==='wrong'?'shake':''}>
          <div className="flex gap-2">
            <input ref={inputRef} type="text" inputMode="numeric"
              value={value}
              onChange={(e)=>{const v=e.target.value; if(v===''||/^-?\d*$/.test(v)){setValue(v);setError(null);}}}
              onKeyDown={onKey}
              disabled={isFrozen||!question}
              placeholder="—"
              className="w-full rounded-lg border-2 border-bomb-line bg-black/50 px-4 py-3 font-mono text-2xl font-bold text-white outline-none transition-all placeholder:text-slate-700 focus:border-bomb-cyan disabled:opacity-40"
              onFocus={(e)=>{e.target.style.boxShadow='0 0 0 3px rgba(57,255,20,0.2),0 0 24px rgba(57,255,20,0.35)';}}
              onBlur={(e)=>{e.target.style.boxShadow='none';}}/>
            <button onClick={submit} disabled={isFrozen||!question}

/* =========================================================
   WIRE COMPONENT
   ========================================================= */
function Wire({label, color, glow, cut, side='left', justCut=false}){
  const [sparks,setSparks]=useState(false);
  useEffect(()=>{ if(justCut){ setSparks(true); const t=setTimeout(()=>setSparks(false),900); return ()=>clearTimeout(t); } },[justCut]);
  const sparksArr = sparks ? Array.from({length:10}).map((_,i)=>{
    const a = (i/10)*Math.PI*2 + Math.random();
    const d = 16 + Math.random()*22;
    return {dx:Math.cos(a)*d, dy:Math.sin(a)*d, c:i%2?'#fff':color, dur:(0.5+Math.random()*0.3)};
  }) : [];

  return (
    <div className={`relative flex items-center gap-2 ${side==='right'?'flex-row-reverse':''}`}>
      <div className="border-2 px-1.5 py-0.5 font-pixel text-[8px] tracking-widest"
           style={{borderColor:color,color,background:'#0a0014',boxShadow:`0 0 8px ${glow}`}}>
        {label}
      </div>
      <div className="relative h-3 w-14 sm:w-20">
        <div className="absolute top-1/2 h-4 w-2 -translate-y-1/2 rounded-sm border-2"
             style={{[side==='right'?'right':'left']:0, borderColor:color, background:'#0a0014'}}/>
        <div className={`absolute top-1/2 h-2 -translate-y-1/2 rounded-full ${cut?(side==='right'?'wire-right-cut':'wire-left-cut'):''}`}
             style={{[side==='right'?'right':'left']:4, width:'45%',
                     background:`linear-gradient(180deg,${color},${color}88)`, boxShadow:`0 0 10px ${glow}`}}/>
        <div className={`absolute top-1/2 h-2 -translate-y-1/2 rounded-full ${cut?(side==='right'?'wire-left-cut':'wire-right-cut'):''}`}
             style={{[side==='right'?'left':'right']:4, width:'45%',
                     background:`linear-gradient(180deg,${color},${color}88)`, boxShadow:`0 0 10px ${glow}`}}/>
        <div className="absolute top-1/2 h-4 w-2 -translate-y-1/2 rounded-sm border-2"
             style={{[side==='right'?'left':'right']:0, borderColor:color, background:'#0a0014'}}/>
        {sparks && (
          <>
            <div className="absolute left-1/2 top-1/2 h-8 w-8 -translate-x-1/2 -translate-y-1/2 rounded-full flash-correct"
                 style={{background:`radial-gradient(circle,#fff 0%,${color} 40%,transparent 70%)`}}/>
            {sparksArr.map((s,i)=>
              <span key={i} className="spark"
                style={{left:'50%',top:'50%',background:s.c,'--dx':s.dx+'px','--dy':s.dy+'px',
                        animation:`sparkFly ${s.dur}s ease-out forwards`}}/>
            )}
          </>
        )}
      </div>
    </div>
  );
}

/* =========================================================
   FREEZE OVERLAY
   ========================================================= */
function FreezeOverlay({freezeEndsAt, fromQ3}){
  const [remaining,setRemaining]=useState(FREEZE_DURATION);
  const beepedRef = useRef(new Set());
  useEffect(()=>{ Snd.hum(); },[]);
  useEffect(()=>{
    let raf;
    const loop=()=>{
      const left = Math.max(0,(freezeEndsAt-performance.now())/1000);
      setRemaining(left);
      const w = Math.ceil(left);
      if(!beepedRef.current.has(w) && w>0){ beepedRef.current.add(w); Snd.beep(); }
      if(left>0) raf=requestAnimationFrame(loop);
    };
    raf=requestAnimationFrame(loop);
    return ()=>cancelAnimationFrame(raf);
  },[freezeEndsAt]);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center">
      <div className="frosted absolute inset-0" style={{background:'rgba(69,10,10,0.6)'}}/>
      <div className="absolute inset-0" style={{background:'radial-gradient(circle at center,rgba(255,51,85,0.4),transparent 70%)',
                                                animation:'pulseGlow 0.9s ease-in-out infinite'}}/>
      <div className="scan"/>
      <div className="noise absolute inset-0"/>
      <div className="relative z-10 flex flex-col items-center px-6 text-center">
        <div className="mb-3 font-pixel text-xl sm:text-3xl md:text-4xl text-red-400 leading-tight"
          style={{textShadow:'0 0 14px #ff3355,0 0 40px #ff3355,4px 4px 0 #000'}}>SYSTEM<br/>LOCKED</div>
        <div className="mb-6 font-pixel text-[8px] sm:text-[10px] tracking-widest text-red-200/80">
          {fromQ3 ? 'FINAL WIRE · NO PENALTY' : 'BREACH DETECTED'}
        </div>
        <div className="font-display text-5xl font-black tabular-nums text-white sm:text-6xl">{remaining.toFixed(1)}</div>
        <div className="mt-6 flex gap-2">
          {[0,1,2,3,4].map(i=>
            <div key={i} className="h-1.5 w-8 rounded-full bg-red-500 transition-opacity"
              style={{opacity: remaining>5-i?1:0.15}}/>
          )}
        </div>
        <div className="mt-8 font-pixel text-[8px] tracking-widest text-red-300/70">
          {fromQ3 ? 'RETRY Q3 WHEN UNLOCKED' : 'PENALTY PROTOCOL ARMED'}
        </div>
      </div>
    </div>
  );
}

        <div className="mt-8 flex flex-wrap items-center justify-center gap-3">
          <button onClick={()=>{Snd.click();onLobby();}}
            className="border-4 border-bomb-cyan bg-bomb-cyan/10 px-6 py-3 font-pixel text-[10px] tracking-widest text-bomb-cyan transition-all hover:bg-bomb-cyan/25 hover:shadow-[0_0_18px_rgba(57,255,20,0.6)] active:scale-95">
            ◄ BACK TO LOBBY
          </button>
        </div>
      </div>
    </div>
  );
}

/* =========================================================
   APP
   ========================================================= */
function App(){
  const [phase,setPhase] = useState('lobby');
  const [room,setRoom] = useState(null);
  const [slot,setSlot] = useState(null);
  const [error,setError] = useState(null);
  const [joining,setJoining] = useState(false);

  const [question,setQuestion] = useState(null);
  const [officialIndex,setOfficialIndex] = useState(0);
  const [stage,setStage] = useState('official');
  const [timeRemaining,setTimeRemaining] = useState(GAME_DURATION);
  const [isFrozen,setIsFrozen] = useState(false);
  const [freezeEndsAt,setFreezeEndsAt] = useState(0);
  const [freezeFromQ3,setFreezeFromQ3] = useState(false);
  const [myWires,setMyWires] = useState([false,false,false]);
  const [oppWires,setOppWires] = useState([false,false,false]);
  const [lastMyCut,setLastMyCut] = useState(null);
  const [lastOppCut,setLastOppCut] = useState(null);
  const [wrongCount,setWrongCount] = useState(0);
  const [shakeKey,setShakeKey] = useState(0);
  const [outcome,setOutcome] = useState(null);
  const [finalTime,setFinalTime] = useState(0);

  const socketRef = useRef(null);
  const startedAtRef = useRef(null);
  const slotRef = useRef(null);
  const timeRef = useRef(GAME_DURATION);
  const rafRef = useRef(null);
  const lastFrameRef = useRef(performance.now());
  const freezeRef = useRef({isFrozen:false, endsAt:0, fromQ3:false});
  const lastPenaltyRef = useRef(null);
  const phaseRef = useRef('lobby');
  useEffect(()=>{ phaseRef.current = phase; },[phase]);

  useEffect(()=>{ timeRef.current = timeRemaining; },[timeRemaining]);
  useEffect(()=>{ freezeRef.current = {isFrozen, endsAt:freezeEndsAt, fromQ3:freezeFromQ3}; },[isFrozen,freezeEndsAt,freezeFromQ3]);
  useEffect(()=>{ slotRef.current = slot; },[slot]);

  useEffect(()=>{
    const socket = io();
    socketRef.current = socket;

    socket.on('roomCreated', ({code, slot}) => {
      setRoom(code); setSlot(slot); setPhase('waiting'); setError(null); setJoining(false);
    });
    socket.on('roomJoined', ({code, slot}) => {
      setRoom(code); setSlot(slot); setPhase('waiting'); setError(null); setJoining(false);
    });
    socket.on('joinError', ({message}) => {
      setError(message); setJoining(false);
    });
    socket.on('matchReady', () => {
      setPhase('countdown');
    });
    socket.on('matchStart', ({startedAt}) => {
      startedAtRef.current = startedAt;
      timeRef.current = GAME_DURATION;
      setTimeRemaining(GAME_DURATION);
      setPhase('playing');
    });
    socket.on('opponentWireCut', ({questionIndex}) => {
      setOppWires(prev => { const n = [...prev]; n[questionIndex] = true; return n; });
      setLastOppCut(questionIndex);
    });
    socket.on('matchOver', ({winner, finalTime, reason}) => {
      const mySlot = slotRef.current;
      const iWon = (winner === mySlot);
      setFinalTime(finalTime || 0);
      setOutcome(iWon ? 'won' : (winner === 'none' ? 'timeout' : 'lost'));
      setPhase('outcome');
      setTimeout(()=>setPhase('ended'), iWon ? 3200 : 1900);
    });
    socket.on('opponentLeft', () => {
      setError('OPPONENT LEFT'); setPhase('lobby'); setRoom(null);
    });

    return ()=>{ socket.disconnect(); };
  }, []);

  useEffect(()=>{
    if(phase === 'countdown' && room){
      const seed = room.split('').reduce((a,c)=>a+c.charCodeAt(0), 0) % 15 + 1;
      const qs = ROOM_QUESTIONS[seed];
      setOfficialIndex(0);
      setStage('official');
      setQuestion({id:qs[0].id, code:qs[0].code, answer:qs[0].answer, label:'OFFICIAL QUESTION 1'});
      setMyWires([false,false,false]);
      setOppWires([false,false,false]);
      setLastMyCut(null);
      setLastOppCut(null);
      setWrongCount(0);
      setShakeKey(0);
      setOutcome(null);
      setFinalTime(0);
      setError(null);
      lastPenaltyRef.current = null;
      freezeRef.current = {isFrozen:false, endsAt:0, fromQ3:false};
      setIsFrozen(false);
      setFreezeEndsAt(0);
      setFreezeFromQ3(false);
    }
  },[phase, room]);

  useEffect(()=>{
    if(phase !== 'playing') return;
    lastFrameRef.current = performance.now();
    const loop = (now) => {
      const delta = Math.min(0.1, (now - lastFrameRef.current) / 1000);
      lastFrameRef.current = now;

      let remaining;
      if(startedAtRef.current){
        remaining = GAME_DURATION - (Date.now() - startedAtRef.current) / 1000;
      } else {
        remaining = timeRef.current - delta;
      }

      const f = freezeRef.current;
      if(f.isFrozen && now >= f.endsAt){
        setIsFrozen(false);
        freezeRef.current.isFrozen = false;
        if(f.fromQ3){
          setFreezeFromQ3(false);
        } else {
          const pool = PENALTIES.filter(p => p.id !== lastPenaltyRef.current);
          const src = pool.length ? pool : PENALTIES;
          const p = src[Math.floor(Math.random()*src.length)];
          lastPenaltyRef.current = p.id;
          setStage('penalty');
          setQuestion({id:p.id, code:p.code, answer:p.answer, label:'PENALTY QUESTION'});
        }
      }

      if(remaining <= 0){
        timeRef.current = 0;
        setTimeRemaining(0);
      } else {
        timeRef.current = remaining;
        setTimeRemaining(remaining);
      }
      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);
    return ()=>{ if(rafRef.current) cancelAnimationFrame(rafRef.current); };
  },[phase]);

  const handleCreate = () => {
    setJoining(true);
    socketRef.current.emit('createRoom');
  };
  const handleJoin = (code) => {
    setJoining(true);
    setError(null);
    socketRef.current.emit('joinRoom', { code });
  };

  const handleSubmit = (value) => {
    if(isFrozen || !question) return null;
    const ok = value === question.answer;

    if(ok){
      const idx = officialIndex;
      const next = [...myWires];
      next[idx] = true;
      setMyWires(next);
      setLastMyCut(idx);

      socketRef.current.emit('wireCut', { questionIndex: idx });

      if(idx === 2){
        // Q3 solved → wait for server matchOver
      } else {
        const seed = room.split('').reduce((a,c)=>a+c.charCodeAt(0), 0) % 15 + 1;
        const qs = ROOM_QUESTIONS[seed];
        const nq = qs[idx + 1];
        setOfficialIndex(idx + 1);
        setStage('official');
        setQuestion({id:nq.id, code:nq.code, answer:nq.answer, label:`OFFICIAL QUESTION ${idx+2}`});
        lastPenaltyRef.current = null;
      }
      return true;
    }

    const isQ3 = (stage === 'official' && officialIndex === 2);
    setWrongCount(c => c + 1);
    setShakeKey(k => k + 1);
    setIsFrozen(true);
    setFreezeFromQ3(isQ3);
    const endsAt = performance.now() + FREEZE_DURATION * 1000;
    setFreezeEndsAt(endsAt);
    freezeRef.current = {isFrozen:true, endsAt, fromQ3:isQ3};
    return false;
  };

  const handleLobby = () => {
    window.location.reload();
  };

  return (
    <div className="relative h-full w-full overflow-hidden" style={{background:'#0a0014'}}>
      <CircuitBackground wrongCount={wrongCount} lastCutIndex={lastMyCut}/>
      <div className="relative z-10 h-full w-full">
        {phase === 'lobby' && (
          <Lobby onCreate={handleCreate} onJoin={handleJoin} joining={joining} error={error} roomCode={null}/>
        )}
        {phase === 'waiting' && (
          <Lobby onCreate={handleCreate} onJoin={handleJoin} joining={joining} error={error} roomCode={room}/>
        )}
        {phase === 'countdown' && (
          <div className="h-full w-full flex items-center justify-center">
            <CountdownOverlay/>
          </div>
        )}
        {phase === 'playing' && (
          <div className="relative flex h-full w-full flex-col overflow-hidden lg:flex-row">
            <div className="relative flex min-h-0 flex-1 flex-col lg:h-full lg:w-1/2 lg:flex-none">
              <QuestionPanel
                question={question}
                stage={stage}
                isFrozen={isFrozen}
                myWires={myWires}
                onSubmit={handleSubmit}
                shakeKey={shakeKey}/>
            </div>
            <div className="relative h-1 w-full shrink-0 lg:h-full lg:w-1"
                 style={{background:'linear-gradient(90deg,#39ff14,#ff00ff,#00ffff)'}}>
              <div className="absolute left-1/2 top-1/2 h-2 w-2 -translate-x-1/2 -translate-y-1/2 rotate-45 border-2 border-bomb-cyan"
                style={{background:'#0a0014'}}/>
            </div>
            <div className="relative flex min-h-0 flex-1 flex-col lg:h-full lg:w-1/2 lg:flex-none">
              <BombPanel
                timeRemaining={timeRemaining}
                myWires={myWires}
                oppWires={oppWires}
                lastMyCut={lastMyCut}
                lastOppCut={lastOppCut}
                room={room}
                slot={slot}/>
            </div>
            {isFrozen && <FreezeOverlay freezeEndsAt={freezeEndsAt} fromQ3={freezeFromQ3}/>}
          </div>
        )}
        {phase === 'outcome' && <OutcomeOverlay won={outcome === 'won'}/>}
        {phase === 'ended' && (
          <EndScreen outcome={outcome} finalTime={finalTime} room={room} onLobby={handleLobby}/>
        )}
      </div>

      <CelestiaFooter/>
      <div className="crt-overlay"/>
      <div className="crt-vignette"/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
